<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服薬管理</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f2f4f7;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      background: #4a90d9;
      color: white;
      padding: 16px 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      padding-bottom: 14px;
    }

    /* タブ */
    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active { color: white; border-bottom-color: white; }

    /* コンテンツ */
    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* カード */
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* 達成率バー */
    .progress-wrap {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
      color: #555;
    }
    .progress-label strong { color: #1a1a2e; }
    .progress-bar {
      height: 10px;
      background: #e8ecf0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #4a90d9;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* タイミンググループ */
    .timing-group { margin-bottom: 16px; }
    .timing-label {
      font-size: 12px;
      font-weight: 700;
      color: #888;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    /* 服薬アイテム（定期） */
    .med-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: white;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      cursor: pointer;
      transition: background 0.15s;
    }
    .med-item.taken { background: #f0f9f4; }
    .med-item:active { background: #f5f5f5; }

    .med-check {
      width: 24px;
      height: 24px;
      border: 2px solid #ccc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .med-item.taken .med-check { background: #34c678; border-color: #34c678; color: white; }
    .med-check-icon { display: none; font-size: 13px; }
    .med-item.taken .med-check-icon { display: block; }

    .med-info { flex: 1; min-width: 0; }
    .med-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .med-item.taken .med-name { color: #888; text-decoration: line-through; }
    .med-dose { font-size: 12px; color: #999; margin-top: 2px; }
    .med-time { font-size: 12px; color: #34c678; font-weight: 600; flex-shrink: 0; }

    /* 頓服セクション */
    .prn-section {
      margin-top: 8px;
    }
    .prn-section-label {
      font-size: 12px;
      font-weight: 700;
      color: #888;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .prn-item {
      background: #e4e7ec;
      border: 1px solid #d0d4db;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .prn-item.active {
      background: white;
      border-color: transparent;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .prn-item-header {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 10px;
    }
    .prn-icon { font-size: 20px; flex-shrink: 0; }
    .prn-info { flex: 1; min-width: 0; }
    .prn-name { font-size: 15px; font-weight: 600; }
    .prn-dose { font-size: 12px; color: #999; margin-top: 2px; }
    .prn-times {
      padding: 0 14px 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .prn-time-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff3e0;
      color: #e67e22;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .prn-time-chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: #e67e22;
      font-size: 14px;
      line-height: 1;
      padding: 0 0 0 2px;
      opacity: 0.6;
    }
    .prn-time-chip button:hover { opacity: 1; }
    .prn-btn-wrap { padding: 8px 14px 12px; }
    .btn-prn {
      width: 100%;
      padding: 10px;
      background: #f5a623;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-prn:active { opacity: 0.8; }

    .empty-msg {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      padding: 32px 0;
    }

    /* 薬の登録フォーム */
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4a90d9; }

    /* 種別ラジオ */
    .type-radios { display: flex; gap: 8px; }
    .type-radio-label {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
      user-select: none;
      text-align: center;
    }
    .type-radio-label input { display: none; }
    .type-radio-label.selected-regular { background: #4a90d9; border-color: #4a90d9; color: white; }
    .type-radio-label.selected-prn { background: #f5a623; border-color: #f5a623; color: white; }

    .timing-checkboxes { display: flex; gap: 8px; flex-wrap: wrap; }
    .timing-check-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1.5px solid #ddd;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
      user-select: none;
    }
    .timing-check-label input { display: none; }
    .timing-check-label.selected { background: #4a90d9; border-color: #4a90d9; color: white; }

    .btn {
      display: inline-block;
      padding: 11px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #4a90d9; color: white; width: 100%; }
    .btn-danger { background: #ff4d4d; color: white; font-size: 13px; padding: 6px 12px; }
    .btn-secondary { background: #e8ecf0; color: #555; font-size: 13px; padding: 6px 12px; }

    /* 登録済み薬一覧 */
    .medicine-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .medicine-list-item:last-child { border-bottom: none; }
    .medicine-list-info .name { font-size: 15px; font-weight: 600; }
    .medicine-list-info .sub { font-size: 12px; color: #999; margin-top: 2px; }
    .medicine-list-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .drag-handle {
      color: #ccc;
      font-size: 18px;
      cursor: grab;
      padding: 0 8px 0 0;
      flex-shrink: 0;
      user-select: none;
      touch-action: none;
    }
    .sortable-ghost { opacity: 0.4; background: #e8f0ff; }
    .medicine-list-item.paused { opacity: 0.5; }
    .btn-pause { background: #e8ecf0; color: #555; font-size: 13px; padding: 6px 12px; }
    .btn-resume { background: #34c678; color: white; font-size: 13px; padding: 6px 12px; }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge-prn { background: #fff3e0; color: #e67e22; }
    .badge-regular { background: #e8f4fd; color: #4a90d9; }

    /* バックアップ */
    .backup-section { display: flex; flex-direction: column; gap: 10px; }
    .btn-backup { background: #34c678; color: white; }
    .restore-input { display: none; }
    .restore-label {
      display: block;
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      background: #f5a623;
      color: white;
      transition: opacity 0.15s;
    }
    .restore-label:active { opacity: 0.8; }

    /* 履歴 */
    /* 月ナビゲーション */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .month-nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #4a90d9;
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .month-nav-btn:hover { background: #f0f5ff; }
    .month-nav-btn:disabled { color: #ccc; cursor: default; }
    .month-nav-btn:disabled:hover { background: none; }
    .month-nav-label { font-size: 16px; font-weight: 700; }

    .history-date {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      margin-bottom: 8px;
      padding-top: 4px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 14px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-status { font-size: 16px; flex-shrink: 0; }
    .history-med-name { font-weight: 600; }
    .history-timing { color: #999; font-size: 12px; }
    .history-time { color: #34c678; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .history-prn-time { color: #e67e22; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .history-missed {
      color: #ff4d4d; font-size: 12px; font-weight: 600; flex-shrink: 0;
      cursor: pointer; text-decoration: underline dotted;
    }
    .history-time { cursor: pointer; text-decoration: underline dotted; }

    /* 編集モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 17px; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions .btn { flex: 1; }

    /* 時刻修正モーダル */
    .time-modal {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      text-align: center;
    }
    .time-modal h3 { font-size: 16px; margin-bottom: 16px; }
    input[type="time"] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 22px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
    }
    input[type="time"]:focus { border-color: #4a90d9; }
    .time-modal-actions { display: flex; gap: 8px; }
    .time-modal-actions .btn { flex: 1; }

    .med-time { cursor: pointer; text-decoration: underline dotted; }
    .prn-time-chip { cursor: default; }
    .prn-time-value { cursor: pointer; text-decoration: underline dotted; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a2e;
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      transition: transform 0.3s ease;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    section h2 {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header>
  <h1>💊 服薬管理</h1>
  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('today')">今日</button>
    <button class="tab-btn" onclick="switchTab('register')">薬の登録</button>
    <button class="tab-btn" onclick="switchTab('history')">履歴</button>
  </nav>
</header>

<!-- タブ1：今日の服薬チェック -->
<div id="tab-today" class="tab-content active">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="today-date"></span>
      <strong id="today-progress">0 / 0 服用済み</strong>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div id="today-list"></div>
</div>

<!-- タブ2：薬の登録 -->
<div id="tab-register" class="tab-content">
  <section class="card">
    <h2 id="form-title">薬を登録する</h2>

    <div class="form-group">
      <label>種別 <span style="color:red">*</span></label>
      <div class="type-radios">
        <label class="type-radio-label selected-regular" id="type-label-regular" onclick="selectType('regular')">
          <input type="radio" name="med-type" value="regular" checked>
          🕐 定期服用
        </label>
        <label class="type-radio-label" id="type-label-prn" onclick="selectType('prn')">
          <input type="radio" name="med-type" value="prn">
          ⚡ 頓服
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>薬の名前 <span style="color:red">*</span></label>
      <input type="text" id="med-name" placeholder="例：ロキソニン">
    </div>
    <div class="form-group">
      <label>用量</label>
      <input type="text" id="med-dose" placeholder="例：60mg、1錠">
    </div>
    <div class="form-group" id="timing-group">
      <label>服用タイミング <span style="color:red">*</span></label>
      <div class="timing-checkboxes" id="timing-checkboxes">
        <label class="timing-check-label" onclick="toggleTiming(this)">
          <input type="checkbox" value="朝">朝
        </label>
        <label class="timing-check-label" onclick="toggleTiming(this)">
          <input type="checkbox" value="昼">昼
        </label>
        <label class="timing-check-label" onclick="toggleTiming(this)">
          <input type="checkbox" value="夜">夜
        </label>
        <label class="timing-check-label" onclick="toggleTiming(this)">
          <input type="checkbox" value="就寝前">就寝前
        </label>
      </div>
    </div>
    <div class="form-group">
      <label>メモ（任意）</label>
      <input type="text" id="med-memo" placeholder="例：食後に服用、頭痛時">
    </div>
    <div class="form-group">
      <label>服用開始日</label>
      <input type="date" id="med-registered-at" style="width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;outline:none;">
    </div>
    <input type="hidden" id="edit-id">
    <button class="btn btn-primary" onclick="saveMedicine()">登録する</button>
    <button class="btn btn-secondary" id="cancel-edit-btn" style="display:none;margin-top:8px;width:100%" onclick="cancelEdit()">キャンセル</button>
  </section>

  <section>
    <h2 style="padding-left:4px;margin-bottom:8px">登録済みの薬</h2>
    <div class="card" id="medicine-list">
      <p class="empty-msg">まだ薬が登録されていません</p>
    </div>
  </section>

  <section class="card" style="margin-top:8px">
    <h2 style="margin-bottom:12px">バックアップ・復元</h2>
    <div class="backup-section">
      <button class="btn btn-backup" onclick="exportData()">データをバックアップ</button>
      <label class="restore-label">
        データを復元
        <input type="file" class="restore-input" accept=".json" onchange="importData(event)">
      </label>
    </div>
    <p style="font-size:12px;color:#aaa;margin-top:10px;line-height:1.6">
      バックアップは <code>medlog_backup.json</code> として保存されます。<br>
      復元すると現在のデータは上書きされます。
    </p>
  </section>
</div>

<!-- タブ3：服薬履歴 -->
<div id="tab-history" class="tab-content">
  <div class="month-nav">
    <button class="month-nav-btn" id="history-prev-btn" onclick="changeHistoryMonth(-1)">◀</button>
    <span class="month-nav-label" id="history-month-label"></span>
    <button class="month-nav-btn" id="history-next-btn" onclick="changeHistoryMonth(1)">▶</button>
  </div>
  <div id="history-list"></div>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>薬を編集する</h3>
    <div class="form-group">
      <label>種別</label>
      <div class="type-radios">
        <label class="type-radio-label selected-regular" id="modal-type-label-regular" onclick="modalSelectType('regular')">
          <input type="radio" name="modal-med-type" value="regular" checked>
          🕐 定期服用
        </label>
        <label class="type-radio-label" id="modal-type-label-prn" onclick="modalSelectType('prn')">
          <input type="radio" name="modal-med-type" value="prn">
          ⚡ 頓服
        </label>
      </div>
    </div>
    <div class="form-group">
      <label>薬の名前</label>
      <input type="text" id="modal-name">
    </div>
    <div class="form-group">
      <label>用量</label>
      <input type="text" id="modal-dose">
    </div>
    <div class="form-group" id="modal-timing-group">
      <label>服用タイミング</label>
      <div class="timing-checkboxes" id="modal-timings">
        <label class="timing-check-label" onclick="toggleTiming(this)">
          <input type="checkbox" value="朝">朝
        </label>
        <label class="timing-check-label" onclick="toggleTiming(this)">
          <input type="checkbox" value="昼">昼
        </label>
        <label class="timing-check-label" onclick="toggleTiming(this)">
          <input type="checkbox" value="夜">夜
        </label>
        <label class="timing-check-label" onclick="toggleTiming(this)">
          <input type="checkbox" value="就寝前">就寝前
        </label>
      </div>
    </div>
    <div class="form-group">
      <label>メモ</label>
      <input type="text" id="modal-memo">
    </div>
    <div class="form-group">
      <label>服用開始日</label>
      <input type="date" id="modal-registered-at" style="width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;outline:none;">
    </div>
    <input type="hidden" id="modal-edit-id">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<!-- 時刻修正モーダル -->
<div class="modal-overlay" id="time-modal-overlay">
  <div class="time-modal">
    <h3 id="time-modal-title">服用時刻を修正</h3>
    <input type="time" id="time-input">
    <div class="time-modal-actions">
      <button class="btn btn-secondary" onclick="closeTimeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveTimeEdit()">保存</button>
    </div>
    <button class="btn btn-danger" id="time-modal-unmark-btn" style="display:none;width:100%;margin-top:8px" onclick="unmarkFromModal()">未服用にする</button>
  </div>
</div>

<!-- トースト通知 -->
<div class="toast" id="toast"></div>

<script>
  // ==============================
  // データ管理
  // ==============================
  const TIMINGS = ['朝', '昼', '夜', '就寝前'];

  function getData() {
    return {
      medicines: JSON.parse(localStorage.getItem('medicines') || '[]'),
      logs: JSON.parse(localStorage.getItem('logs') || '{}')
    };
  }

  function saveMedicines(medicines) {
    localStorage.setItem('medicines', JSON.stringify(medicines));
  }

  function saveLogs(logs) {
    localStorage.setItem('logs', JSON.stringify(logs));
  }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatTime(isoStr) {
    const d = new Date(isoStr);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function formatDateLabel(key) {
    const [y, m, d] = key.split('-');
    const date = new Date(Number(y), Number(m)-1, Number(d));
    const days = ['日','月','火','水','木','金','土'];
    const today = todayKey();
    const yesterday = (() => {
      const t = new Date(); t.setDate(t.getDate()-1);
      return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    })();
    let label = `${Number(m)}月${Number(d)}日（${days[date.getDay()]}）`;
    if (key === today) label += '　今日';
    else if (key === yesterday) label += '　昨日';
    return label;
  }

  function generateId() {
    return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  }

  // 後方互換：typeがない古いデータはregularとして扱う
  function medType(m) {
    return m.type || 'regular';
  }

  // ==============================
  // タブ切替
  // ==============================
  function switchTab(name) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    const btns = document.querySelectorAll('.tab-btn');
    const idx = ['today','register','history'].indexOf(name);
    btns[idx].classList.add('active');
    if (name === 'today') renderToday();
    if (name === 'history') renderHistory();
    if (name === 'register') renderMedicineList();
  }

  // ==============================
  // タブ1：今日の服薬チェック
  // ==============================
  function renderToday() {
    const { medicines, logs } = getData();
    const key = todayKey();
    const todayLog = logs[key] || {};

    // 日付表示
    const d = new Date();
    const days = ['日','月','火','水','木','金','土'];
    document.getElementById('today-date').textContent =
      `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;

    const activeMeds = medicines.filter(m => m.active !== false);
    const regularMeds = activeMeds.filter(m => medType(m) === 'regular');
    const prnMeds = activeMeds.filter(m => medType(m) === 'prn');

    if (medicines.length === 0) {
      document.getElementById('today-list').innerHTML =
        '<p class="empty-msg">薬が登録されていません。<br>「薬の登録」タブから追加してください。</p>';
      document.getElementById('today-progress').textContent = '0 / 0 服用済み';
      document.getElementById('progress-fill').style.width = '0%';
      return;
    }

    // 定期服用の達成率集計（頓服は含めない）
    let total = 0, done = 0;
    regularMeds.forEach(m => {
      m.timings.forEach(t => {
        total++;
        if (todayLog[m.id]?.[t]?.taken) done++;
      });
    });

    document.getElementById('today-progress').textContent =
      total > 0 ? `${done} / ${total} 服用済み` : '定期服用なし';
    document.getElementById('progress-fill').style.width =
      total > 0 ? `${Math.round(done/total*100)}%` : '0%';

    let html = '';

    // 定期服用：タイミング別グループ
    const timingEmoji = { '朝': '🌅', '昼': '☀️', '夜': '🌙', '就寝前': '🛏️' };
    TIMINGS.forEach(timing => {
      const medsForTiming = regularMeds.filter(m => m.timings.includes(timing));
      if (medsForTiming.length === 0) return;

      html += `<div class="timing-group">
        <div class="timing-label">${timingEmoji[timing]} ${timing}</div>`;

      medsForTiming.forEach(m => {
        const entry = todayLog[m.id]?.[timing];
        const taken = entry?.taken || false;
        const time = entry?.time ? formatTime(entry.time) : '';
        const sub = [m.dose, m.memo].filter(Boolean).join('・');
        html += `<div class="med-item ${taken ? 'taken' : ''}" onclick="toggleTaken('${m.id}','${timing}')">
          <div class="med-check"><span class="med-check-icon">✓</span></div>
          <div class="med-info">
            <div class="med-name">${escHtml(m.name)}</div>
            ${sub ? `<div class="med-dose">${escHtml(sub)}</div>` : ''}
          </div>
          ${taken ? `<div class="med-time" onclick="event.stopPropagation();openTimeEdit('${m.id}','${timing}','${entry?.time || ''}')">${time} ✎</div>` : ''}
        </div>`;
      });

      html += '</div>';
    });

    // 頓服セクション
    if (prnMeds.length > 0) {
      html += `<div class="prn-section">
        <div class="prn-section-label">⚡ 頓服（症状時）</div>`;

      prnMeds.forEach(m => {
        const times = todayLog[m.id]?.prn || [];
        const sub = [m.dose, m.memo].filter(Boolean).join('・');
        const countLabel = times.length > 0 ? `今日 ${times.length}回服用` : '今日はまだ服用していません';

        const chipsHtml = times.map(iso =>
          `<div class="prn-time-chip">
            <span class="prn-time-value" onclick="openPrnTimeEdit('${m.id}','${iso}')">${formatTime(iso)} ✎</span>
            <button onclick="removePrnDose('${m.id}','${iso}')" title="取り消し">×</button>
          </div>`
        ).join('');

        html += `<div class="prn-item ${times.length > 0 ? 'active' : ''}">
          <div class="prn-item-header">
            <span class="prn-icon">💊</span>
            <div class="prn-info">
              <div class="prn-name">${escHtml(m.name)}</div>
              <div class="prn-dose">${escHtml(sub || countLabel)}${sub ? '　' + countLabel : ''}</div>
            </div>
          </div>
          ${times.length > 0 ? `<div class="prn-times">${chipsHtml}</div>` : ''}
          <div class="prn-btn-wrap">
            <button class="btn-prn" onclick="addPrnDose('${m.id}')">今服用した</button>
          </div>
        </div>`;
      });

      html += '</div>';
    }

    document.getElementById('today-list').innerHTML = html;
  }

  function toggleTaken(medId, timing) {
    const { logs } = getData();
    const key = todayKey();
    if (!logs[key]) logs[key] = {};
    if (!logs[key][medId]) logs[key][medId] = {};
    const current = logs[key][medId][timing]?.taken || false;
    logs[key][medId][timing] = {
      taken: !current,
      time: !current ? new Date().toISOString() : null
    };
    saveLogs(logs);
    renderToday();
    if (!current) showToast('服用を記録しました');
  }

  function addPrnDose(medId) {
    const { logs } = getData();
    const key = todayKey();
    if (!logs[key]) logs[key] = {};
    if (!logs[key][medId]) logs[key][medId] = {};
    if (!logs[key][medId].prn) logs[key][medId].prn = [];
    logs[key][medId].prn.push(new Date().toISOString());
    saveLogs(logs);
    renderToday();
    showToast('服用を記録しました');
  }

  function removePrnDose(medId, isoStr) {
    const { logs } = getData();
    const key = todayKey();
    if (!logs[key]?.[medId]?.prn) return;
    logs[key][medId].prn = logs[key][medId].prn.filter(t => t !== isoStr);
    saveLogs(logs);
    renderToday();
    showToast('記録を取り消しました');
  }

  // ==============================
  // タブ2：薬の登録
  // ==============================
  function selectType(type) {
    document.querySelector('input[name="med-type"][value="' + type + '"]').checked = true;
    document.getElementById('type-label-regular').className =
      'type-radio-label' + (type === 'regular' ? ' selected-regular' : '');
    document.getElementById('type-label-prn').className =
      'type-radio-label' + (type === 'prn' ? ' selected-prn' : '');
    document.getElementById('timing-group').style.display = type === 'regular' ? '' : 'none';
  }

  function modalSelectType(type) {
    document.querySelector('input[name="modal-med-type"][value="' + type + '"]').checked = true;
    document.getElementById('modal-type-label-regular').className =
      'type-radio-label' + (type === 'regular' ? ' selected-regular' : '');
    document.getElementById('modal-type-label-prn').className =
      'type-radio-label' + (type === 'prn' ? ' selected-prn' : '');
    document.getElementById('modal-timing-group').style.display = type === 'regular' ? '' : 'none';
  }

  function getSelectedType() {
    return document.querySelector('input[name="med-type"]:checked')?.value || 'regular';
  }

  function getModalSelectedType() {
    return document.querySelector('input[name="modal-med-type"]:checked')?.value || 'regular';
  }

  function toggleTiming(labelEl) {
    setTimeout(() => {
      const cb = labelEl.querySelector('input[type="checkbox"]');
      labelEl.classList.toggle('selected', cb.checked);
    }, 0);
  }

  function getSelectedTimings(containerId) {
    return Array.from(
      document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`)
    ).map(cb => cb.value);
  }

  function saveMedicine() {
    const name = document.getElementById('med-name').value.trim();
    const dose = document.getElementById('med-dose').value.trim();
    const memo = document.getElementById('med-memo').value.trim();
    const registeredAt = document.getElementById('med-registered-at').value || todayKey();
    const type = getSelectedType();
    const timings = type === 'regular' ? getSelectedTimings('timing-checkboxes') : [];
    const editId = document.getElementById('edit-id').value;

    if (!name) { showToast('薬の名前を入力してください'); return; }
    if (type === 'regular' && timings.length === 0) {
      showToast('服用タイミングを選択してください'); return;
    }

    const { medicines } = getData();

    if (editId) {
      const idx = medicines.findIndex(m => m.id === editId);
      if (idx !== -1) {
        medicines[idx] = { ...medicines[idx], name, dose, memo, type, timings, registeredAt };
        showToast('薬の情報を更新しました');
      }
    } else {
      medicines.push({ id: generateId(), name, dose, memo, type, timings, registeredAt });
      showToast('薬を登録しました');
    }

    saveMedicines(medicines);
    resetForm();
    renderMedicineList();
  }

  function resetForm() {
    document.getElementById('med-name').value = '';
    document.getElementById('med-dose').value = '';
    document.getElementById('med-memo').value = '';
    document.getElementById('edit-id').value = '';
    document.getElementById('med-registered-at').value = todayKey();
    document.getElementById('form-title').textContent = '薬を登録する';
    document.getElementById('cancel-edit-btn').style.display = 'none';
    document.querySelectorAll('#timing-checkboxes input[type="checkbox"]').forEach(cb => {
      cb.checked = false;
      cb.closest('label').classList.remove('selected');
    });
    selectType('regular');
  }

  function cancelEdit() { resetForm(); }

  function toggleMedicinePause(id) {
    const { medicines } = getData();
    const idx = medicines.findIndex(m => m.id === id);
    if (idx === -1) return;
    const paused = medicines[idx].active === false;
    medicines[idx].active = paused ? true : false;
    saveMedicines(medicines);
    renderMedicineList();
    showToast(paused ? '服用を再開しました' : '一時停止しました');
  }

  function deleteMedicine(id) {
    if (!confirm('この薬を削除しますか？\n（過去の服薬記録は残ります）')) return;
    const { medicines } = getData();
    saveMedicines(medicines.filter(m => m.id !== id));
    renderMedicineList();
    showToast('削除しました');
  }

  function openEditModal(id) {
    const { medicines } = getData();
    const m = medicines.find(m => m.id === id);
    if (!m) return;

    document.getElementById('modal-edit-id').value = id;
    document.getElementById('modal-name').value = m.name;
    document.getElementById('modal-dose').value = m.dose || '';
    document.getElementById('modal-memo').value = m.memo || '';
    document.getElementById('modal-registered-at').value = m.registeredAt || todayKey();

    const type = medType(m);
    modalSelectType(type);

    document.querySelectorAll('#modal-timings input[type="checkbox"]').forEach(cb => {
      const checked = (m.timings || []).includes(cb.value);
      cb.checked = checked;
      cb.closest('label').classList.toggle('selected', checked);
    });

    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function saveModal() {
    const id = document.getElementById('modal-edit-id').value;
    const name = document.getElementById('modal-name').value.trim();
    const dose = document.getElementById('modal-dose').value.trim();
    const memo = document.getElementById('modal-memo').value.trim();
    const registeredAt = document.getElementById('modal-registered-at').value || todayKey();
    const type = getModalSelectedType();
    const timings = type === 'regular' ? getSelectedTimings('modal-timings') : [];

    if (!name) { showToast('薬の名前を入力してください'); return; }
    if (type === 'regular' && timings.length === 0) {
      showToast('服用タイミングを選択してください'); return;
    }

    const { medicines } = getData();
    const idx = medicines.findIndex(m => m.id === id);
    if (idx !== -1) {
      medicines[idx] = { ...medicines[idx], name, dose, memo, type, timings, registeredAt };
      saveMedicines(medicines);
      showToast('薬の情報を更新しました');
    }

    closeModal();
    renderMedicineList();
  }

  function renderMedicineList() {
    const { medicines } = getData();
    const container = document.getElementById('medicine-list');

    if (medicines.length === 0) {
      container.innerHTML = '<p class="empty-msg">まだ薬が登録されていません</p>';
      return;
    }

    if (window._medicinesSortable) {
      window._medicinesSortable.destroy();
      window._medicinesSortable = null;
    }

    container.innerHTML = medicines.map(m => {

      const type = medType(m);
      const badgeHtml = type === 'prn'
        ? '<span class="badge badge-prn">頓服</span>'
        : '<span class="badge badge-regular">定期</span>';
      const subParts = [];
      if (m.dose) subParts.push(m.dose);
      if (type === 'regular' && m.timings?.length) subParts.push(m.timings.join('・'));
      if (m.memo) subParts.push(m.memo);
      const sub = subParts.join(' ／ ');
      const paused = m.active === false;
      return `<div class="medicine-list-item${paused ? ' paused' : ''}" data-id="${m.id}">
        <span class="drag-handle">☰</span>
        <div class="medicine-list-info">
          <div class="name">${escHtml(m.name)}${badgeHtml}</div>
          <div class="sub">${paused ? '一時停止中　' : ''}${escHtml(sub)}</div>
        </div>
        <div class="medicine-list-actions">
          ${paused
            ? `<button class="btn btn-resume" onclick="toggleMedicinePause('${m.id}')">再開</button>`
            : `<button class="btn btn-secondary" onclick="openEditModal('${m.id}')">編集</button>
               <button class="btn btn-pause" onclick="toggleMedicinePause('${m.id}')">一時停止</button>`}
          <button class="btn btn-danger" onclick="deleteMedicine('${m.id}')">削除</button>
        </div>
      </div>`;
    }).join('');

    if (typeof Sortable !== 'undefined') {
      window._medicinesSortable = new Sortable(container, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd(evt) {
          const { medicines } = getData();
          const [moved] = medicines.splice(evt.oldIndex, 1);
          medicines.splice(evt.newIndex, 0, moved);
          saveMedicines(medicines);
        }
      });
    }
  }

  // ==============================
  // バックアップ・復元
  // ==============================
  function exportData() {
    const data = getData();
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'medlog_backup.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('バックアップを保存しました');
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.medicines || !data.logs) throw new Error('形式が不正です');
        if (!confirm('現在のデータを上書きして復元しますか？')) {
          event.target.value = '';
          return;
        }
        saveMedicines(data.medicines);
        saveLogs(data.logs);
        renderMedicineList();
        renderToday();
        showToast('データを復元しました');
      } catch {
        showToast('ファイルの読み込みに失敗しました');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  // ==============================
  // タブ3：服薬履歴
  // ==============================
  // 現在表示中の年月（{ year, month } month は0始まり）
  let _historyYM = { year: new Date().getFullYear(), month: new Date().getMonth() };

  function changeHistoryMonth(delta) {
    let { year, month } = _historyYM;
    month += delta;
    if (month < 0) { month = 11; year--; }
    if (month > 11) { month = 0; year++; }
    _historyYM = { year, month };
    renderHistory();
  }

  function renderHistory() {
    const { medicines, logs } = getData();
    const container = document.getElementById('history-list');
    const { year, month } = _historyYM;
    const today = new Date();
    const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();

    // 月ナビ更新
    document.getElementById('history-month-label').textContent = `${year}年${month + 1}月`;
    document.getElementById('history-next-btn').disabled = isCurrentMonth;

    if (medicines.length === 0) {
      container.innerHTML = '<p class="empty-msg">薬が登録されていません</p>';
      return;
    }

    // 表示月の全日付を生成（今日より未来は除く）
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const dateSet = new Set();
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${year}-${String(month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (key <= todayKey()) dateSet.add(key);
    }
    // その月のログにある日付も追加（念のため）
    Object.keys(logs).forEach(k => { if (k.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)) dateSet.add(k); });

    const dates = Array.from(dateSet).sort((a, b) => b.localeCompare(a));
    const activeMeds = medicines.filter(m => m.active !== false);
    const pausedMeds = medicines.filter(m => m.active === false);
    const regularMeds = activeMeds.filter(m => medType(m) === 'regular');
    const prnMeds = activeMeds.filter(m => medType(m) === 'prn');
    const pausedRegularMeds = pausedMeds.filter(m => medType(m) === 'regular');
    const pausedPrnMeds = pausedMeds.filter(m => medType(m) === 'prn');

    let html = '';
    dates.forEach(dateKey => {
      const dayLog = logs[dateKey] || {};
      let dayHtml = '';

      // 定期服用の履歴（アクティブ：全日表示）
      regularMeds.forEach(m => {
        if (m.registeredAt && dateKey < m.registeredAt) return;
        m.timings.forEach(timing => {
          const entry = dayLog[m.id]?.[timing];
          const taken = entry?.taken || false;
          const time = entry?.time ? formatTime(entry.time) : null;
          const sub = [m.dose, m.memo].filter(Boolean).join('・');

          dayHtml += `<div class="history-item">
            <span class="history-status">${taken ? '✅' : '❌'}</span>
            <div style="flex:1;min-width:0">
              <span class="history-med-name">${escHtml(m.name)}</span>
              ${sub ? `<span style="font-size:12px;color:#bbb;margin-left:6px">${escHtml(sub)}</span>` : ''}
            </div>
            <span class="history-timing">${timing}</span>
            ${taken && time
              ? `<span class="history-time" onclick="openTimeEdit('${m.id}','${timing}','${entry.time}','${dateKey}')">${time} ✎</span>`
              : taken ? ''
              : `<span class="history-missed" onclick="openHistoryMissedEdit('${dateKey}','${m.id}','${timing}','${escHtml(m.name)}')">未服用 → 記録する</span>`}
          </div>`;
        });
      });

      // 定期服用の履歴（停止中：服用記録がある日のみ表示）
      pausedRegularMeds.forEach(m => {
        m.timings.forEach(timing => {
          const entry = dayLog[m.id]?.[timing];
          if (!entry?.taken) return;
          const taken = entry.taken || false;
          const time = entry.time ? formatTime(entry.time) : null;
          const sub = [m.dose, m.memo].filter(Boolean).join('・');

          dayHtml += `<div class="history-item" style="opacity:0.6">
            <span class="history-status">${taken ? '✅' : '❌'}</span>
            <div style="flex:1;min-width:0">
              <span class="history-med-name">${escHtml(m.name)}</span>
              ${sub ? `<span style="font-size:12px;color:#bbb;margin-left:6px">${escHtml(sub)}</span>` : ''}
            </div>
            <span class="history-timing">${timing}</span>
            ${taken && time ? `<span class="history-time">${time}</span>` : ''}
          </div>`;
        });
      });

      // 頓服の履歴（アクティブ）
      prnMeds.forEach(m => {
        if (m.registeredAt && dateKey < m.registeredAt) return;
        const times = dayLog[m.id]?.prn || [];
        const sub = [m.dose, m.memo].filter(Boolean).join('・');
        if (times.length > 0) {
          const timesStr = times.map(t => formatTime(t)).join(' / ');
          dayHtml += `<div class="history-item">
            <span class="history-status">💊</span>
            <div style="flex:1;min-width:0">
              <span class="history-med-name">${escHtml(m.name)}</span>
              ${sub ? `<span style="font-size:12px;color:#bbb;margin-left:6px">${escHtml(sub)}</span>` : ''}
            </div>
            <span class="history-timing">頓服</span>
            <span class="history-prn-time">${timesStr}（${times.length}回）</span>
          </div>`;
        }
      });

      // 頓服の履歴（停止中：ログがある日のみ）
      pausedPrnMeds.forEach(m => {
        const times = dayLog[m.id]?.prn || [];
        const sub = [m.dose, m.memo].filter(Boolean).join('・');
        if (times.length > 0) {
          const timesStr = times.map(t => formatTime(t)).join(' / ');
          dayHtml += `<div class="history-item" style="opacity:0.6">
            <span class="history-status">💊</span>
            <div style="flex:1;min-width:0">
              <span class="history-med-name">${escHtml(m.name)}</span>
              ${sub ? `<span style="font-size:12px;color:#bbb;margin-left:6px">${escHtml(sub)}</span>` : ''}
            </div>
            <span class="history-timing">頓服</span>
            <span class="history-prn-time">${timesStr}（${times.length}回）</span>
          </div>`;
        }
      });

      if (dayHtml) {
        html += `<div class="card">
          <div class="history-date">${formatDateLabel(dateKey)}</div>
          ${dayHtml}
        </div>`;
      }
    });

    container.innerHTML = html || '<p class="empty-msg">履歴がありません</p>';
  }

  // ==============================
  // ユーティリティ
  // ==============================
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ==============================
  // 時刻修正モーダル
  // ==============================
  let _timeEditContext = null; // { type, medId, timing?, oldIso, dateKey, isNew? }

  function openTimeEdit(medId, timing, isoStr, dateKey) {
    _timeEditContext = { type: 'regular', medId, timing, oldIso: isoStr, dateKey: dateKey || todayKey() };
    document.getElementById('time-modal-title').textContent = `${timing}の服用時刻を修正`;
    document.getElementById('time-input').value = isoStr ? formatTime(isoStr) : '';
    document.getElementById('time-modal-unmark-btn').style.display = '';
    document.getElementById('time-modal-overlay').classList.add('open');
  }

  function openHistoryMissedEdit(dateKey, medId, timing, medName) {
    _timeEditContext = { type: 'regular', medId, timing, oldIso: null, dateKey, isNew: true };
    document.getElementById('time-modal-title').textContent = `${medName}（${timing}）の服用時刻を入力`;
    document.getElementById('time-input').value = '';
    document.getElementById('time-modal-unmark-btn').style.display = 'none';
    document.getElementById('time-modal-overlay').classList.add('open');
  }

  function openPrnTimeEdit(medId, isoStr) {
    _timeEditContext = { type: 'prn', medId, oldIso: isoStr, dateKey: todayKey() };
    document.getElementById('time-modal-title').textContent = '頓服の服用時刻を修正';
    document.getElementById('time-input').value = isoStr ? formatTime(isoStr) : '';
    document.getElementById('time-modal-unmark-btn').style.display = 'none';
    document.getElementById('time-modal-overlay').classList.add('open');
  }

  function closeTimeModal() {
    document.getElementById('time-modal-overlay').classList.remove('open');
    _timeEditContext = null;
  }

  function saveTimeEdit() {
    if (!_timeEditContext) return;
    const timeValue = document.getElementById('time-input').value;
    if (!timeValue) { showToast('時刻を入力してください'); return; }

    const { logs } = getData();
    const key = _timeEditContext.dateKey;
    const [h, m] = timeValue.split(':').map(Number);

    // 日付はdateKeyから、時刻はinputから組み立てる
    const [y, mo, d] = key.split('-').map(Number);
    const newDate = new Date(y, mo - 1, d, h, m, 0, 0);
    const newIso = newDate.toISOString();

    if (!logs[key]) logs[key] = {};

    if (_timeEditContext.type === 'regular') {
      const { medId, timing, isNew } = _timeEditContext;
      if (!logs[key][medId]) logs[key][medId] = {};
      logs[key][medId][timing] = { taken: true, time: newIso };
      saveLogs(logs);
      closeTimeModal();
      if (key === todayKey()) renderToday();
      renderHistory();
      showToast(isNew ? '服用を記録しました' : '時刻を修正しました');
    } else {
      const { medId, oldIso } = _timeEditContext;
      if (!logs[key][medId]) logs[key][medId] = {};
      if (!logs[key][medId].prn) logs[key][medId].prn = [];
      logs[key][medId].prn = logs[key][medId].prn.map(t => t === oldIso ? newIso : t);
      saveLogs(logs);
      closeTimeModal();
      renderToday();
      showToast('時刻を修正しました');
    }
  }

  function unmarkFromModal() {
    if (!_timeEditContext) return;
    const { dateKey, medId, timing } = _timeEditContext;
    if (!confirm('服用記録を取り消しますか？')) return;
    const { logs } = getData();
    if (logs[dateKey]?.[medId]?.[timing]) {
      logs[dateKey][medId][timing] = { taken: false, time: null };
      saveLogs(logs);
      closeTimeModal();
      if (dateKey === todayKey()) renderToday();
      renderHistory();
      showToast('服用記録を取り消しました');
    }
  }


  document.getElementById('time-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeTimeModal();
  });

  // ==============================
  // 初期化
  // ==============================
  document.getElementById('med-registered-at').value = todayKey();
  renderToday();
</script>
</body>
</html>
